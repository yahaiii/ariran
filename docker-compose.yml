# ariran local development stack
# Start with: make dev-up
# Stop with:  make dev-down

services:

  db:
    image: postgis/postgis:15-3.4-alpine
    container_name: ariran_postgres
    environment:
      POSTGRES_DB: ariran
      POSTGRES_USER: ariran_pipeline
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_dev}
    ports:
      - "5432:5432"
    volumes:
      - ariran_pgdata:/var/lib/postgresql/data
      - ./nigeria_crime_db_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ariran_pipeline -d ariran"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ariran_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ariran.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  ariran_pgdata:
