name: Integration Tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_live_connectors:
        description: "Run live connector integration tests"
        required: false
        default: false
        type: boolean

jobs:
  integration-db:
    runs-on: ubuntu-latest
    services: {}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Start DB stack (docker-compose)
        run: |
          docker compose up -d db

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            docker exec $(docker ps -q -f name=ariran_postgres) pg_isready -U ariran_pipeline -d ariran && break || sleep 2
          done

      - name: Initialize database
        run: |
          python scripts/init_db.py

      - name: Run integration tests
        run: |
          pytest tests/integration/test_api_smoke.py tests/integration/test_promote_integration.py -q

      - name: Tear down
        if: always()
        run: |
          docker compose down -v

  live-connectors:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_connectors == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run live connector integration tests
        env:
          INTEGRATION_TESTS: "1"
          ACLED_EMAIL: ${{ secrets.ACLED_EMAIL }}
          ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}
          ACLED_API_KEY: ${{ secrets.ACLED_API_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          USER_AGENT: ${{ vars.USER_AGENT }}
        run: |
          mkdir -p test-results
          pytest tests/integration/test_live_connectors.py -q -r a --junitxml=test-results/live-connectors.xml

      - name: Upload live test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-connector-test-results
          path: test-results/
